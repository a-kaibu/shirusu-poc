# Win32 Metadata Generator (L03) の対象 API 一覧。
#
# 記載順に api_id を割り当てる（first_api_id から連番）。ID の安定性の
# ため、新しい API は末尾への追加のみとし、既存の行の並べ替え・削除は
# しないこと。生成 API を手書き表へ昇格させる場合は、ここから外して
# 手書きの ApiDef + 専用 Detour へ置き換える（その場合も ID は再利用
# しない。欠番は欠番のまま残す）。
#
# last_error の省略時は戻り値の種類から既定を決める:
# BOOL -> false、HANDLE/ポインタ -> null、WIN32_ERROR/HRESULT/NTSTATUS/
# その他の整数/void -> never。失敗条件が分かる API は明示する。
# 値: false / null / invalid-handle / minus-one / never / always /
# unspecified。

first_api_id = 7
max_params = 12
winmd_version = "71.0.45-preview"

