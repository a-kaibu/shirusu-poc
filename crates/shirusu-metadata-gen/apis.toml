# ---- 意図的な除外 ----
# GetLastError / SetLastError: Detour 自身が LastError を読む・戻すため、
# フックすると自己参照になる。
[[skip]]
namespace = "Windows.Win32.Foundation"
module = "kernel32.dll"
function = "GetLastError"
reason = "Detour 自身が GetLastError を読むため自己参照になる"
[[skip]]
namespace = "Windows.Win32.Foundation"
module = "kernel32.dll"
function = "SetLastError"
reason = "Detour 自身が LastError を戻すために SetLastError を使うため自己参照になる"
# GlobalFree / LocalFree: 成功時に NULL を返す（失敗時はハンドル）。
# NULL = 成功の反転した意味のため、WhenReturnIsNull の既定では扱えない。
[[skip]]
namespace = "Windows.Win32.System.Memory"
module = "kernel32.dll"
function = "GlobalFree"
reason = "成功時に NULL を返す反転した意味のため、L1 の意味条件では扱えない"
[[skip]]
namespace = "Windows.Win32.System.Memory"
module = "kernel32.dll"
function = "LocalFree"
reason = "成功時に NULL を返す反転した意味のため、L1 の意味条件では扱えない"
