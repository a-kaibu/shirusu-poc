[package]
name = "shirusu-agent-dll"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "shirusu Agent DLL: 対象プロセスへ注入され、Bootstrap 初期化でフックを設置する cdylib"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
shirusu-agent = { path = "../shirusu-agent" }
shirusu-hook = { path = "../shirusu-hook" }
shirusu-transport = { path = "../shirusu-transport" }
shirusu-transport-win = { path = "../shirusu-transport-win" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation","Win32_System_Threading","Win32_System_LibraryLoader", "Win32_System_Diagnostics_Debug", "Win32_System_Memory", "Win32_Security"] }

[lints]
workspace = true
