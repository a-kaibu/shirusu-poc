[package]
name = "shirusu-hook"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "shirusu フックエンジン: API 定義表・型付き引数取得・IAT フック計画と Windows 実装"

[dependencies]
shirusu-transport = { path = "../shirusu-transport" }
shirusu-transport-win = { path = "../shirusu-transport-win" }
shirusu-agent = { path = "../shirusu-agent" }
shirusu-trace = { path = "../shirusu-trace" }
# L01: Inline Hook の命令再配置に使う。デコーダ＋BlockEncoder
# （トランポリンへの再配置・分岐の拡大・RIP 相対の修正）のみで、
# フォーマッタ等は不要。プラットフォーム非依存のコアは Linux でも
# テストするため、通常依存として置く。
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "block_encoder", "instr_info"] }

[target.'cfg(windows)'.dependencies]
# L01: スレッド停止に ToolHelp（スレッド列挙）と Kernel（CONTEXT）を追加。
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Memory", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Kernel", "Wdk_Foundation", "Win32_System_IO", "Win32_System_WindowsProgramming", "Wdk_System_SystemInformation"] }

[build-dependencies]
cc = "1"

[dev-dependencies]
proptest = "1"

[lints]
workspace = true
