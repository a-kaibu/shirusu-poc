[package]
name = "shirusu-hook"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "shirusu フックエンジン: API 定義表・型付き引数取得・IAT フック計画と Windows 実装"

[dependencies]
shirusu-transport = { path = "../shirusu-transport" }
shirusu-transport-win = { path = "../shirusu-transport-win" }
shirusu-agent = { path = "../shirusu-agent" }
shirusu-trace = { path = "../shirusu-trace" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Memory", "Win32_System_LibraryLoader", "Win32_System_Threading"] }

[dev-dependencies]
proptest = "1"

[lints]
workspace = true
