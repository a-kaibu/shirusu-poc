[package]
name = "shirusu-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "shirusu 解析・記録 CLI: inspect（メタデータ・完全性・API 集計）/ dump（イベント表示・検索）/ export（JSONL / Parquet）/ repair / capture・attach（Windows での記録）"

[dependencies]
tempfile = "3"
# Apache-2.0; 59.x supports our Rust 1.87 MSRV (60.x requires 1.88).
parquet = { version = "59", default-features = false, features = ["snap"] }
shirusu-api-catalog = { path = "../shirusu-api-catalog" }
shirusu-analysis = { path = "../shirusu-analysis" }
shirusu-host = { path = "../shirusu-host" }
shirusu-trace = { path = "../shirusu-trace" }
shirusu-transport = { path = "../shirusu-transport" }

[dev-dependencies]
proptest = "1"

[[bin]]
name = "shirusu"
path = "src/main.rs"

[lints]
workspace = true
