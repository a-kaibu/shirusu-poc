[package]
name = "shirusu-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "shirusu 解析・記録 CLI: inspect（メタデータ・完全性・API 集計）/ dump（イベント表示・検索）/ export（JSONL）/ repair / capture・attach（Windows での記録）"

[dependencies]
shirusu-hook = { path = "../shirusu-hook" }
shirusu-analysis = { path = "../shirusu-analysis" }
shirusu-host = { path = "../shirusu-host" }
shirusu-trace = { path = "../shirusu-trace" }
shirusu-transport = { path = "../shirusu-transport" }

[[bin]]
name = "shirusu"
path = "src/main.rs"

[lints]
workspace = true
