name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      suite:
        description: "実行するスイート"
        type: choice
        options: [ci, nightly, weekly, apps, all]
        default: ci
        required: true
  schedule:
    - cron: "17 3 * * *" # nightly
    - cron: "23 4 * * 0" # weekly（日曜: nightly + 長時間 fuzz）

permissions:
  contents: read

concurrency:
  # Keep only the newest run per ref and suite. A manual CI run supersedes a
  # push run; long scheduled/manual verification suites remain independent.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.suite || github.event.schedule || 'ci' }}
  cancel-in-progress: true

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_SUITE: ${{ inputs.suite }}
        run: |
          if [ -f scripts/ci/plan.sh ]; then
            bash scripts/ci/plan.sh
          else
            echo "scripts/ci/plan.sh not found; using built-in fallback matrix" >&2
            jq -cn '{include: [
              {name:"linux", os:"ubuntu-latest", toolchain:"stable", targets:"", components:"rustfmt, clippy", java:false, run:"bash scripts/ci/linux.sh", allow_failure:false, timeout:30},
              {name:"windows-x64", os:"windows-latest", toolchain:"stable", targets:"x86_64-pc-windows-msvc", components:"", java:false, run:"pwsh -NoProfile -File scripts/ci/windows.ps1", allow_failure:false, timeout:60},
              {name:"windows-x86-wow64", os:"windows-latest", toolchain:"stable", targets:"x86_64-pc-windows-msvc, i686-pc-windows-msvc", components:"", java:false, run:"pwsh -NoProfile -File scripts/ci/windows-x86.ps1", allow_failure:false, timeout:60},
              {name:"windows-check-targets", os:"ubuntu-latest", toolchain:"stable", targets:"x86_64-pc-windows-msvc, i686-pc-windows-msvc", components:"", java:false, run:"cargo check -p shirusu-transport-win -p shirusu-agent -p shirusu-host --target x86_64-pc-windows-msvc && cargo check -p shirusu-transport-win -p shirusu-agent -p shirusu-host --target i686-pc-windows-msvc", allow_failure:false, timeout:30},
              {name:"macos-validation", os:"macos-latest", toolchain:"stable", targets:"", components:"", java:false, run:"cargo test -p shirusu-transport", allow_failure:false, timeout:30},
              {name:"tla", os:"ubuntu-latest", toolchain:"stable", targets:"", components:"", java:true, run:"bash scripts/ci/tla.sh", allow_failure:false, timeout:30}
            ]}' > /tmp/matrix.json
            echo "matrix=$(cat /tmp/matrix.json)" >> "$GITHUB_OUTPUT"
          fi

  run:
    name: ${{ matrix.name }}
    needs: plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    continue-on-error: ${{ matrix.allow_failure }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - if: ${{ matrix.java }}
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - if: ${{ !matrix.java }}
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ matrix.toolchain }}
          targets: ${{ matrix.targets }}
          components: ${{ matrix.components }}
      - if: ${{ !matrix.java }}
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.name }}
          # Preserve freshly compiled dependencies even when a later E2E fails.
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: |
            . -> target
            fuzz -> target
          cache-directories: ${{ matrix.name == 'kani' && '~/.kani' || '' }}
      - if: ${{ matrix.name == 'linux' }}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: target/winmd
          key: winmd-${{ hashFiles('scripts/ci/fetch-winmd.sh') }}
      - if: ${{ matrix.java }}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: tla/tla2tools.jar
          key: tla-tools-${{ hashFiles('scripts/ci/tla.sh') }}
      - name: ${{ matrix.name }}
        # shell は検証規則で matrix 参照が使えないため bash に固定する。
        # Windows 向けスクリプトは matrix 側のコマンドで pwsh を起動して実行する。
        shell: bash
        run: ${{ matrix.run }}
      - name: Preserve native performance measurements
        if: ${{ always() && runner.os == 'Windows' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-performance-${{ matrix.name }}
          path: |
            target/ci-diagnostics/native-performance-*.json
            target/ci-diagnostics/native-performance-phases-*.txt
            target/ci-diagnostics/sustained-load-*.json
            target/ci-diagnostics/real-apps-*.json
            target/ci-diagnostics/real-*-compare.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Preserve Windows reference corpus
        if: ${{ always() && runner.os == 'Windows' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-reference-corpus-${{ matrix.name }}
          path: target/windows-reference-corpus
          if-no-files-found: ignore
          retention-days: 30
      - name: Preserve Windows capture diagnostics
        # cancelled() covers a job stopped at timeout-minutes (review 2026-11-14 V11).
        if: ${{ (failure() || cancelled()) && runner.os == 'Windows' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: capture-diagnostics-${{ matrix.name }}
          path: target/ci-diagnostics
          if-no-files-found: ignore
          retention-days: 7

  done:
    name: done
    needs: [plan, run]
    # Unlike always(), this still reports failures but is cancellable when a
    # newer commit arrives. Do not strand an obsolete run in the concurrency slot.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: check matrix result
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          MATRIX_RESULT: ${{ needs.run.result }}
        run: |
          echo "plan result: $PLAN_RESULT; matrix result: $MATRIX_RESULT"
          if [ "$PLAN_RESULT" != "success" ] || [ "$MATRIX_RESULT" != "success" ]; then
            exit 1
          fi
