[package]
name = "shirusu-fuzz"
version = "0.1.0"
edition = "2021"
license = "MIT"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
shirusu-trace = { path = "../crates/shirusu-trace" }
shirusu-transport = { path = "../crates/shirusu-transport" }
shirusu-hook = { path = "../crates/shirusu-hook" }
shirusu-host = { path = "../crates/shirusu-host" }
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder"] }

[workspace]

[[bin]]
name = "validate_control"
path = "fuzz_targets/validate_control.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_descriptor"
path = "fuzz_targets/decode_descriptor.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_payload"
path = "fuzz_targets/decode_payload.rs"
test = false
doc = false
bench = false

[[bin]]
name = "snapshot_fragments"
path = "fuzz_targets/snapshot_fragments.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_compact"
path = "fuzz_targets/decode_compact.rs"
test = false
doc = false
bench = false

[[bin]]
name = "recover_trace"
path = "fuzz_targets/recover_trace.rs"
test = false
doc = false
bench = false

[[bin]]
name = "stream_trace"
path = "fuzz_targets/stream_trace.rs"
test = false
doc = false
bench = false

